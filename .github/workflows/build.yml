name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    env:
      SCCACHE_GHA_ENABLED: "true"

    strategy:
      matrix:
        # The Linux job must not use the ubuntu-latest alias: that alias is
        # migrated gradually and silently changes the glibc the release
        # artifacts are linked against, which raises the minimum glibc required
        # at run time (issue #143). It must not pin ubuntu-22.04 either, because
        # that image began deprecation on 2026-09-17 and is retired on
        # 2027-04-17. Instead the job runs on a current runner and does the
        # actual build inside a pinned ubuntu:22.04 container, which fixes the
        # glibc floor at 2.34 independently of the host image.
        os: [ubuntu-24.04, macos-15, windows-latest]
        build_type: [Release]
        include:
          # platform is the runtime the artifact targets, not the machine that
          # builds it. It names the artifact and keys the vcpkg cache, so it
          # must stay stable when the runner image changes.
          - os: ubuntu-24.04
            container_image: ubuntu:22.04
            platform: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    # sccache only for the native builds. The Linux build runs in a container
    # with its own glibc, so a host-provided sccache/PATH cannot be used there.
    - if: matrix.os == 'macos-15'
      name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - if: matrix.os != 'ubuntu-24.04'
      name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        doNotCache: true # cache vcpkg_installed ourselves instead

    # vcpkg must be bootstrapped by the container's own toolchain. A binary
    # bootstrapped on the ubuntu-24.04 host needs glibc 2.39 and would fail
    # inside the glibc 2.35 container.
    - if: matrix.os == 'ubuntu-24.04'
      name: Setup vcpkg (Linux container)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:${{ github.workspace }}" \
          -w "${{ github.workspace }}" \
          -e HOST_UID="$(id -u)" \
          -e HOST_GID="$(id -g)" \
          "${{ matrix.container_image }}" \
          bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --yes --no-install-recommends \
              git curl zip unzip tar ca-certificates build-essential

            if [ ! -d vcpkg/.git ]; then
              git clone https://github.com/microsoft/vcpkg.git vcpkg
            fi
            if [ -f vcpkg/bootstrap-vcpkg.sh ]; then
              ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
            fi

            # Hand the clone back to the runner user. Git refuses to read a
            # repository owned by another user ("dubious ownership"), so the
            # host-side "Get vcpkg commit" step would fail while this stays
            # root-owned.
            chown -R "${HOST_UID}:${HOST_GID}" vcpkg
          '

    - name: Get vcpkg commit
      id: vcpkg-commit
      shell: bash
      run: |
        # Fail instead of emitting an empty sha. An empty value would collapse
        # the cache key to "vcpkg-<platform>--<manifest>" and make unrelated
        # runs share a cache entry.
        sha="$(git -C '${{ github.workspace }}/vcpkg' rev-parse --verify HEAD)"
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    - name: Get runner image version
      id: runner-image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg installed packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/build/vcpkg_installed
          ${{ github.workspace }}/build_ds/vcpkg_installed
        # Linux keys on the target platform, everything else on the runner
        # image version.
        #
        # Linux builds its dependencies inside the pinned ubuntu:22.04
        # container, which does not change when GitHub rolls ubuntu-24.04, so
        # tying that key to ImageVersion throws away a warm cache on every
        # runner bump and forces a full ~45 minute source rebuild of
        # mbedtls/abseil/protobuf.
        #
        # macOS is the opposite: a runner update does change the Xcode/SDK and
        # the libraries must be rebuilt, so keep the image version there.
        key: vcpkg-${{ matrix.platform || steps.runner-image.outputs.version }}-${{ steps.vcpkg-commit.outputs.sha }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlays/**') }}
        restore-keys: |
          vcpkg-${{ matrix.platform || steps.runner-image.outputs.version }}-${{ steps.vcpkg-commit.outputs.sha }}-

    # Run the Linux build inside the pinned Ubuntu 22.04 container so the
    # artifacts keep the GLIBC_2.34 floor regardless of the runner image.
    - if: matrix.os == 'ubuntu-24.04'
      name: Build Linux (ubuntu:22.04 container)
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:${{ github.workspace }}" \
          -w "${{ github.workspace }}" \
          -e CI=true \
          -e VCPKG_DEFAULT_BINARY_CACHE=/tmp/vcpkg-bincache \
          -e VCPKG_ROOT="${{ github.workspace }}/vcpkg" \
          -e HOST_UID="$(id -u)" \
          -e HOST_GID="$(id -g)" \
          "${{ matrix.container_image }}" \
          bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --yes --no-install-recommends \
              build-essential cmake ninja-build git curl zip unzip tar \
              pkg-config ca-certificates gcc-multilib g++-multilib

            mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}" "${{ github.workspace }}/release"

            cmake -B "${{ github.workspace }}/build" -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S "${{ github.workspace }}" \
              -DOUTDIR="${{ github.workspace }}/release" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-linux \
              -DBUILD_TESTING=ON
            cmake --build "${{ github.workspace }}/build" --config ${{ matrix.build_type }}
            ctest --test-dir "${{ github.workspace }}/build" --output-on-failure

            cmake -B "${{ github.workspace }}/build_ds" -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S "${{ github.workspace }}" \
              -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_ASM_FLAGS=-m32 \
              -DOUTDIR="${{ github.workspace }}/release" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x86-linux
            cmake --build "${{ github.workspace }}/build_ds" --config ${{ matrix.build_type }} \
              --target srcds csgo_gc game_types_tests
            ctest --test-dir "${{ github.workspace }}/build_ds" --output-on-failure \
              -R "^game_types_tests$"

            # The container runs as root; hand the workspace back to the runner
            # user so the later Package/upload steps can write to it.
            chown -R "${HOST_UID}:${HOST_GID}" \
              "${{ github.workspace }}/build" \
              "${{ github.workspace }}/build_ds" \
              "${{ github.workspace }}/release"
          '

    - if: matrix.os == 'macos-15'
      name: Build macOS
      run: |
        mkdir ${{ github.workspace }}/release
        cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -S ${{ github.workspace }} -DCMAKE_OSX_ARCHITECTURES=x86_64 -DFUNCHOOK_CPU=x86 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DOUTDIR=${{ github.workspace }}/release -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-osx -DBUILD_TESTING=ON
        cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }}
        ctest --test-dir ${{ github.workspace }}/build --build-config ${{ matrix.build_type }} --output-on-failure

    - if: matrix.os == 'windows-latest'
      name: Build Windows
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/release"
        cmake `
          -A Win32 `
          -S "${{ github.workspace }}" `
          -B "${{ github.workspace }}/build" `
          -DOUTDIR="${{ github.workspace }}/release" `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x86-windows-static `
          -DBUILD_TESTING=ON
        cmake `
          --build "${{ github.workspace }}/build" `
          --config ${{ matrix.build_type }}
        ctest `
          --test-dir "${{ github.workspace }}/build" `
          --build-config ${{ matrix.build_type }} `
          --output-on-failure

    - name: Package
      shell: bash
      run: |
        cp $GITHUB_WORKSPACE/README.md $GITHUB_WORKSPACE/release/
        mkdir $GITHUB_WORKSPACE/release/licenses
        cp $GITHUB_WORKSPACE/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-csgo_gc.txt
        cp $GITHUB_WORKSPACE/build/_deps/funchook-src/distorm/COPYING $GITHUB_WORKSPACE/release/licenses/LICENSE-distorm.txt
        cp $GITHUB_WORKSPACE/build/_deps/funchook-src/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-funchook.txt
        mkdir -p $GITHUB_WORKSPACE/release/csgo_gc
        cp $GITHUB_WORKSPACE/examples/config.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/inventory.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/price_sheet.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/gc_loot_lists.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/unusual_loot_lists.txt $GITHUB_WORKSPACE/release/csgo_gc/

        # Collect licenses installed by vcpkg from each target build tree.
        case "${{ matrix.os }}" in
          ubuntu-24.04)
            VCPKG_SHARES=(
              "$GITHUB_WORKSPACE/build/vcpkg_installed/x64-linux/share"
              "$GITHUB_WORKSPACE/build_ds/vcpkg_installed/x86-linux/share"
            )
            ;;
          macos-15)
            VCPKG_SHARES=("$GITHUB_WORKSPACE/build/vcpkg_installed/x64-osx/share")
            ;;
          windows-latest)
            VCPKG_SHARES=("$GITHUB_WORKSPACE/build/vcpkg_installed/x86-windows-static/share")
            ;;
        esac

        for vcpkg_share in "${VCPKG_SHARES[@]}"; do
          [ -d "$vcpkg_share" ] || continue
          for portdir in "$vcpkg_share"/*/; do
            port=$(basename "$portdir")
            if [ -f "${portdir}copyright" ]; then
              cp "${portdir}copyright" "$GITHUB_WORKSPACE/release/licenses/LICENSE-$port.txt"
            fi
          done
        done

    - name: Zip artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        OUTNAME: csgo_gc-${{ matrix.platform || matrix.os }}.zip
      run: |
        $out = Join-Path $env:GITHUB_WORKSPACE $env:OUTNAME
        if (Test-Path $out) { Remove-Item $out -Force }
        # include everything under release
        Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'release\*') -DestinationPath $out -Force
        Get-ChildItem $out

    - name: Zip artifacts (non-Windows)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        OUTNAME="csgo_gc-${{ matrix.platform || matrix.os }}.zip"
        (cd release && zip -r "../${OUTNAME}" .)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.platform || matrix.os }}
        path: ${{ github.workspace }}/csgo_gc-${{ matrix.platform || matrix.os }}.zip

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=continuous
          files=( $(find artifacts -type f -name "*.zip") )

          # Only publish when the build produced at least one artifact.
          if [ ${#files[@]} -gt 0 ]; then
            gh release delete "$TAG" --cleanup-tag --repo "$REPO" --yes || true

            # kludge to avoid the release being created as a draft...
            sleep 10s

            gh release create "$TAG" --repo "$REPO" \
              --title "Continuous Build" \
              --notes "$SHA" \
              --target "$SHA"

            gh release upload "$TAG" --repo "$REPO" "${files[@]}" --clobber
          fi
