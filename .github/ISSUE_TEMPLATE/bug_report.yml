name: "Bug report"
description: "Report a bug, crash, or unexpected behavior in the project."
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, make sure your issue isn't caused by modded game files, outdated builds, or a **base game bug** that happens even without csgo_gc installed.

        This is a public form. Remove Steam identifiers, account details, local paths, credentials, tokens, and other sensitive data from all diagnostics. Do not upload raw core dumps or minidumps. If unsanitized diagnostics are necessary, submit the report without them and ask the maintainers to arrange a private transfer.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: "Pre-submission checklist"
      options:
        - label: "I have searched both OPEN and CLOSED issues and confirmed this isn't a duplicate."
          required: true
        - label: "I checked the README and confirmed this is NOT already listed as an unimplemented feature."
          required: true
        - label: "I am using the LATEST version on a CLEAN, UNMODIFIED game build (no mods, altered shared libraries, etc.)."
          required: true
        - label: "I have tested without csgo_gc installed and confirmed this bug DOES NOT happen on the vanilla game."
          required: true
        - label: "I am using an officially supported setup (csgo_legacy branch or standalone app)."
          required: true

  - type: input
    id: csgo_gc_revision
    attributes:
      label: "csgo_gc revision"
      description: "Enter the exact release identifier, build ID, or commit hash of the csgo_gc binary you tested."
      placeholder: "e.g. continuous build abc1234 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: build_type
    attributes:
      label: "Game version"
      description: "Select which version you are running."
      options:
        - "Standalone app (4465480)"
        - "csgo_legacy branch (730)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      description: "Describe the bug or unexpected behavior, and what you expected to happen instead."
      placeholder: "I expected X to happen when Y, but instead Z happened..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to trigger the bug/behavior."
      placeholder: |
        1. Open the inventory '...'
        2. Trigger action '...'
        3. See error / unexpected behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment & OS details"
      description: "Operating system, architecture, etc."
      placeholder: "e.g. macOS 26, x86_64"
    validations:
      required: true

  - type: textarea
    id: gc_log
    attributes:
      label: "Log output (gc_log.txt)"
      description: 'If applicable: set `"log_output"  "1"` in `csgo_gc/config.txt`, reproduce the issue, and paste sanitized log text here. Remove Steam identifiers, account details, local paths, credentials, tokens, and other sensitive data.'
      placeholder: "Paste sanitized contents of gc_log.txt here..."

  - type: textarea
    id: crash_diagnostics
    attributes:
      label: "Core dumps / minidumps / stack traces"
      description: "If the application crashed, paste a sanitized backtrace or stack trace. Do not upload raw core dumps or minidumps, and remove Steam identifiers, local paths, secrets, and other sensitive data."
      placeholder: "Paste a sanitized backtrace or stack trace here..."

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional context"
      description: "Add sanitized config excerpts, screenshots, or other details. Remove Steam identifiers, account details, local paths, credentials, tokens, and other sensitive data before submitting."
